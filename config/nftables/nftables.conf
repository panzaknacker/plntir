#!/usr/sbin/nft -f

# manage only our own table. cloudflare WARP and docker maintain separate
# nftables tables that must survive a reload of this file.
destroy table inet host_filter

table inet host_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # management over the cloudflare mesh is never subject to public
        # rate-limiting or Fail2ban. keep public SSH available during
        # bootstrap and remove this second rule only after both mesh SSH and
        # an independent AWS recovery path have been tested.
        iifname "CloudflareWARP" tcp dport 22 accept
        # the web console binds only to the node's mesh IP. this interface-only
        # rule must never be duplicated as a public TCP/8443 accept rule.
        iifname "CloudflareWARP" tcp dport 8443 accept
        tcp dport 22 accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
