[defaults]
inventory = inventory/deny-all.yml
host_key_checking = True
retry_files_enabled = False
display_skipped_hosts = False
interpreter_python = auto_silent
nocows = True
stdout_callback = default
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = True

[ssh_connection]
pipelining = False
ssh_args = -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes -o UpdateHostKeys=no
