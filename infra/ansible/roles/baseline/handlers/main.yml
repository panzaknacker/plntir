---
- name: Apply Plntir sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload audit rules
  ansible.builtin.command: /sbin/augenrules --load
  changed_when: true

- name: Reload Plntir firewall
  ansible.builtin.command: /usr/sbin/nft -f /etc/nftables.conf
  changed_when: true

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
