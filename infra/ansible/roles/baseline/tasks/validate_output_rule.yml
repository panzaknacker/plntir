---
- name: Validate exact egress rule metadata
  ansible.builtin.assert:
    that:
      - plntir_rule.name is match('^[a-z0-9][a-z0-9-]{1,62}$')
      - >-
        ((plntir_rule.ipv4_destinations | default([]) | length) +
        (plntir_rule.ipv6_destinations | default([]) | length)) > 0
      - (plntir_rule.port | int) >= 1
      - (plntir_rule.port | int) <= 65535
    fail_msg: Egress rules require a bounded port and at least one exact destination.

- name: Validate exact private IPv4 egress destinations
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - (item.split('.') | map('int') | max) <= 255
      - >-
        item is match('^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[78][0-9]|9[0-9]|1[01][0-9]|12[0-7])\.)')
      - item != '0.0.0.0'
      - "'REPLACE' not in item"
      - "'/' not in item"
    fail_msg: Egress IPv4 destinations must be exact RFC1918 or WARP-CGNAT addresses.
  loop: "{{ plntir_rule.ipv4_destinations | default([]) }}"

- name: Validate exact IPv6 egress destinations
  ansible.builtin.assert:
    that:
      - item is match('^[0-9A-Fa-f:]+$')
      - item not in ['::', '::1']
      - not item.lower().startswith('ff')
      - "'REPLACE' not in item"
      - "'/' not in item"
    fail_msg: Egress IPv6 destinations must be exact unicast addresses, never prefixes.
  loop: "{{ plntir_rule.ipv6_destinations | default([]) }}"
