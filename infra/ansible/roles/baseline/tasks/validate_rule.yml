---
- name: Validate exact firewall rule metadata
  ansible.builtin.assert:
    that:
      - plntir_rule.name is match('^[a-z0-9][a-z0-9-]{1,62}$')
      - >-
        ((plntir_rule.ipv4_sources | default([]) | length) +
        (plntir_rule.ipv6_sources | default([]) | length)) > 0
      - >-
        (plntir_rule.port | default(plntir_rule.published_port | default(0)) | int) >= 1
      - >-
        (plntir_rule.port | default(plntir_rule.published_port | default(0)) | int) <= 65535
      - >-
        (plntir_rule.translated_port | default(1) | int) >= 1
      - >-
        (plntir_rule.translated_port | default(1) | int) <= 65535
    fail_msg: Firewall rules require a bounded port and at least one exact source address.

- name: Validate exact private IPv4 firewall sources
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - (item.split('.') | map('int') | max) <= 255
      - >-
        item is match('^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[78][0-9]|9[0-9]|1[01][0-9]|12[0-7])\.)')
      - item != '0.0.0.0'
      - "'REPLACE' not in item"
      - "'/' not in item"
    fail_msg: Firewall IPv4 sources must be exact RFC1918 or WARP-CGNAT addresses.
  loop: "{{ plntir_rule.ipv4_sources | default([]) }}"

- name: Validate exact IPv6 firewall sources
  ansible.builtin.assert:
    that:
      - item is match('^[0-9A-Fa-f:]+$')
      - item not in ['::', '::1']
      - not item.lower().startswith('ff')
      - "'REPLACE' not in item"
      - "'/' not in item"
    fail_msg: Firewall IPv6 sources must be exact unicast addresses, never prefixes.
  loop: "{{ plntir_rule.ipv6_sources | default([]) }}"
